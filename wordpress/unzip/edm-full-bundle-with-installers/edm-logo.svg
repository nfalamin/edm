<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="edmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Electric Border Gradient -->
    <linearGradient id="edmBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Speed Bolt & Accent Gradient -->
    <linearGradient id="edmBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="edmNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Shield / Hexagon -->
  <g filter="url(#softShadow)">
    <path d="M 256,24 
             C 380,24 456,80 456,210 
             C 456,340 350,440 256,488 
             C 162,440 56,340 56,210 
             C 56,80 132,24 256,24 Z" 
          fill="url(#edmBgGrad)" 
          stroke="url(#edmBorderGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"/>
  </g>

  <!-- Inner Tech Shield Rings -->
  <path d="M 256,48 
           C 360,48 428,96 428,210 
           C 428,320 336,410 256,454 
           C 176,410 84,320 84,210 
           C 84,96 152,48 256,48 Z" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-opacity="0.25" 
        stroke-width="3" 
        stroke-dasharray="8 6"/>

  <!-- High-Velocity Turbo Download Chevron Arrows -->
  <g filter="url(#edmNeonGlow)">
    <!-- Top Speed Chevron -->
    <path d="M 170,120 L 256,185 L 342,120 L 312,100 L 256,145 L 200,100 Z" 
          fill="#38BDF8" opacity="0.9"/>
    
    <!-- Dynamic Lightning / Speed Download Arrow -->
    <path d="M 226,170 
             L 286,170 
             L 246,245 
             L 300,245 
             L 216,360 
             L 236,275 
             L 186,275 Z" 
          fill="url(#edmBoltGrad)"/>
  </g>

  <!-- Stylized EDM Lettering -->
  <g filter="url(#softShadow)">
    <!-- E -->
    <path d="M 126,380 L 176,380 L 176,396 L 144,396 L 144,410 L 170,410 L 170,424 L 144,424 L 144,440 L 178,440 L 178,456 L 126,456 Z" 
          fill="#FFFFFF"/>
    
    <!-- D -->
    <path d="M 196,380 L 230,380 C 252,380 262,392 262,418 C 262,444 252,456 230,456 L 196,456 Z 
             M 214,396 L 214,440 L 228,440 C 238,440 244,432 244,418 C 244,404 238,396 228,396 Z" 
          fill="#38BDF8"/>
    
    <!-- M -->
    <path d="M 280,456 L 280,380 L 302,380 L 318,422 L 334,380 L 356,380 L 356,456 L 338,456 L 338,408 L 324,444 L 312,444 L 298,408 L 298,456 Z" 
          fill="#FFFFFF"/>
  </g>

  <!-- 32x Speed Indicator Badge -->
  <rect x="206" y="56" width="100" height="26" rx="13" fill="#6366F1" fill-opacity="0.3" stroke="#818CF8" stroke-width="1.5"/>
  <text x="256" y="73" fill="#22D3EE" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">32x TURBO</text>
</svg>
